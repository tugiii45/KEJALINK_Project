<!--
  KejaLink - Property Management & Rent Payment Platform
  
  Main HTML entry point for the React application.
  The <div id="root"></div> is where React mounts the entire app.
  The React app initializes from src/main.jsx which creates the app structure.
  
  Vite (build tool) will inject the React code and styles during development and build.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KejaLink</title>
  </head>
  <body>
    <!-- React app renders into this div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
